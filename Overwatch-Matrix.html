<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151e">
  <title>Overwatch Hero Grid</title>
  <style>
    :root { color-scheme: dark; --ink: #e9edf4; --orange: #ffab48; --portrait: 48px; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100svh; background: radial-gradient(ellipse at 50% -30%, #283143 0, transparent 62%), #10151e; color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
    main { max-width: 1580px; margin: auto; padding: 27px 30px 30px; }
    .version { max-width: 1580px; margin: 0 auto; padding: 0 30px 16px; text-align: right; color: #8490a3; font-size: 10px; letter-spacing: .06em; }
    @media (max-width: 800px) { .version { padding-right: 12px; } }
    h1 { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 0 0 23px; font-size: clamp(25px, 3vw, 37px); line-height: 1.1; font-weight: 850; font-style: italic; letter-spacing: .12em; }
    h1::before, h1::after { content: ""; width: 35px; height: 3px; background: var(--orange); transform: skewX(-24deg); }
    .chart { display: grid; grid-template-columns: 112px minmax(0, 1fr) 112px; grid-template-rows: 34px minmax(320px, 64svh) 34px; align-items: center; }
    .label { text-align: center; font-size: 12px; letter-spacing: .17em; font-weight: 700; text-transform: uppercase; color: #b6bfce; user-select: none; }
    .top { grid-column: 2; grid-row: 1; align-self: start; color: #e4eaf4; }
    .bottom { grid-column: 2; grid-row: 3; align-self: end; }
    .left { grid-column: 1; grid-row: 2; padding-right: 17px; color: #e2ac81; }
    .right { grid-column: 3; grid-row: 2; padding-left: 17px; color: #98c6dd; }
    .board { position: relative; grid-column: 2; grid-row: 2; align-self: stretch; isolation: isolate; border: 1px solid #435064; border-radius: 5px; background-color: #161d29; background-image: linear-gradient(to right, transparent calc(50% - .7px), #95a1b5 50%, transparent calc(50% + .7px)), linear-gradient(to bottom, transparent calc(50% - .7px), #95a1b5 50%, transparent calc(50% + .7px)), repeating-linear-gradient(to right, transparent 0 calc(10% - 1px), #ffffff09 calc(10% - 1px) 10%), repeating-linear-gradient(to bottom, transparent 0 calc(10% - 1px), #ffffff09 calc(10% - 1px) 10%), linear-gradient(135deg, #e58b3510, transparent 48%, #67b7e209); box-shadow: 0 12px 55px #00000020, inset 0 0 70px #090d1324; }
    .board::after { content: ""; pointer-events: none; position: absolute; width: 7px; height: 7px; border: 1px solid #d9e0eb; background: #18202c; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: -1; }
    .board.drop-target { border-color: #f4af5d; box-shadow: 0 0 0 1px #f4af5d40, 0 12px 55px #00000020; }
    .tray { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 9px; min-height: 126px; margin: 24px 112px 0; padding: 18px 16px; border: 1px solid #303b4d; border-radius: 7px; background: #181f2c9c; box-shadow: inset 0 1px #ffffff03; }
    .tray.drop-target { border-color: #f4af5d; background: #252a34; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin: 18px 112px 0; }
    .role-filters, .action-buttons { display: flex; align-items: center; gap: 7px; }
    .action-buttons { margin-left: auto; }
    .export-button, .role-filter, .reset-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border: 1px solid #536078; border-radius: 5px; background: #202a39; color: var(--ink); font: 600 12px "Segoe UI", Arial, sans-serif; cursor: pointer; }
    .export-button:hover, .role-filter:hover, .reset-button:hover { border-color: var(--orange); background: #2a3443; }
    .export-button:focus-visible, .role-filter:focus-visible, .reset-button:focus-visible, .visibility-dial:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
    .role-filter { color: #909caf; background: #161d29; border-color: #39455a; }
    .role-filter[data-role="tank"] { --role-color: #83b5de; }
    .role-filter[data-role="support"] { --role-color: #b5c898; }
    .role-filter[data-role="damage"] { --role-color: #df9b81; }
    .role-filter[aria-pressed="true"] { color: var(--role-color); border-color: var(--role-color); background: #263142; }
    .filter-visibility { display: flex; align-items: center; gap: 10px; color: #b6bfce; font-size: 11px; }
    .visibility-dial { --dial-sweep: 0deg; --dial-angle: -135deg; position: relative; display: grid; place-items: center; flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; background: conic-gradient(from 225deg, var(--orange) 0deg var(--dial-sweep), #435064 var(--dial-sweep) 270deg, transparent 270deg 360deg); cursor: grab; touch-action: none; user-select: none; }
    .visibility-dial::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #1b2432; box-shadow: inset 0 1px 4px #0005; }
    .visibility-dial::after { content: ""; position: absolute; top: 2px; left: 19px; width: 2px; height: 5px; background: #ffe0b5; border-radius: 1px; transform-origin: 1px 18px; transform: rotate(var(--dial-angle)); }
    .visibility-dial span { position: relative; color: var(--ink); font-size: 10px; font-weight: 600; pointer-events: none; }
    .visibility-dial.adjusting { cursor: grabbing; }
    .tray .hero.is-filtered { display: none; }
    .board .hero.is-filtered { opacity: var(--filtered-opacity, 0); pointer-events: none; }
    .export-button:disabled { opacity: .6; cursor: wait; }
    .actions + .tray { margin-top: 12px; }
    @media (max-width: 800px) { .actions { margin: 16px 38px 0; } }
    .hero { --role: #8da5b9; appearance: none; display: block; flex: 0 0 var(--portrait); width: var(--portrait); height: var(--portrait); padding: 0; margin: 0; overflow: hidden; border: 2px solid #536078; border-bottom-color: var(--role); border-radius: 5px; background: #2e394c; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 3px 6px #00000038; transition: border-color 120ms, box-shadow 120ms; }
    .hero[data-role="tank"] { --role: #83b5de; }
    .hero[data-role="damage"] { --role: #df9b81; }
    .hero[data-role="support"] { --role: #b5c898; }
    .hero:hover { border-color: #ffbf71; box-shadow: 0 0 0 2px #ffbf7118, 0 4px 12px #0006; z-index: 1000 !important; }
    .hero:focus-visible { outline: 2px solid #ffbd67; outline-offset: 4px; }
    .hero img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
    .board .hero { position: absolute; left: clamp(calc(var(--portrait) / 2), var(--x), calc(100% - var(--portrait) / 2)); top: clamp(calc(var(--portrait) / 2), var(--y), calc(100% - var(--portrait) / 2)); transform: translate(-50%, -50%); }
    .hero.dragging { position: fixed; z-index: 10000 !important; cursor: grabbing; transform: none; border-color: #ffc276; box-shadow: 0 10px 25px #0009, 0 0 0 3px #ffb54c20; transition: none; }
    body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
    @media (min-width: 1700px) { .chart { grid-template-rows: 34px minmax(320px, 67svh) 34px; } }
    @media (max-width: 800px) { :root { --portrait: 42px; } main { padding: 24px 12px; } h1 { margin-bottom: 18px; } .chart { grid-template-columns: 38px minmax(0, 1fr) 38px; grid-template-rows: 32px minmax(340px, 58svh) 32px; } .label { font-size: 10px; letter-spacing: .13em; } .left, .right { padding: 0; justify-self: center; writing-mode: vertical-rl; } .left { transform: rotate(180deg); } .tray { margin: 20px 38px 0; padding: 13px 10px; gap: 7px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <h1>Overwatch</h1>
    <section class="chart" aria-label="Hero placement grid">
      <div class="label top">Overtuned</div>
      <div class="label left">Unethical</div>
      <div class="board" id="board" role="group" aria-label="Drag heroes here. Left is unethical, right is ethical, down is undertuned, up is overtuned."></div>
      <div class="label right">Ethical</div>
      <div class="label bottom">Undertuned</div>
    </section>
    <div class="actions">
      <div class="role-filters" role="group" aria-label="Visible hero roles">
        <button class="role-filter" data-role="tank" type="button" aria-pressed="true">Tank</button>
        <button class="role-filter" data-role="support" type="button" aria-pressed="true">Support</button>
        <button class="role-filter" data-role="damage" type="button" aria-pressed="true">DPS</button>
      </div>
      <div class="filter-visibility">
        <span id="visibility-label">Filter Visibility</span>
        <div class="visibility-dial" id="filter-visibility" role="slider" tabindex="0" aria-labelledby="visibility-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0% visibility for filtered-out heroes" aria-description="Drag around the dial or use arrow keys to adjust filtered-out hero visibility.">
          <span id="visibility-value" aria-hidden="true">0%</span>
        </div>
      </div>
      <div class="action-buttons">
      <button class="export-button" id="export-image" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg>
        Export image
      </button>
        <button class="reset-button" id="reset-grid" type="button">Reset</button>
      </div>
    </div>
    <div class="tray" id="tray" role="group" aria-label="Unplaced heroes. Drag a portrait to the grid. Return a portrait here to remove it from the grid."></div>
  </main>

          const p = saved[hero.id];
          if (p && Number.isFinite(p.x) && Number.isFinite(p.y)) {
            positions[hero.id] = { x: Math.max(0, Math.min(1, p.x)), y: Math.max(0, Math.min(1, p.y)) };
          }
        }
      }
    } catch (_) {}

    function save() {
      try { localStorage.setItem(storageKey, JSON.stringify(positions)); } catch (_) {}
    }
    function applyHeroFilter(button) {
      const filtered = !activeRoles.has(button.dataset.role);
      button.classList.toggle('is-filtered', filtered);
      button.disabled = filtered;
      button.inert = filtered;
      button.tabIndex = filtered ? -1 : 0;
      if (filtered) button.setAttribute('aria-hidden', 'true');
      else button.removeAttribute('aria-hidden');
    }
    function applyFilters() {
      if (drag && !activeRoles.has(drag.button.dataset.role)) finish({ pointerId: drag.pointerId }, true);
      buttons.forEach(applyHeroFilter);
      document.querySelectorAll('.role-filter').forEach(button => {
        button.setAttribute('aria-pressed', String(activeRoles.has(button.dataset.role)));
      });
    }
    function setFilteredVisibility(value) {
      const percent = Math.max(0, Math.min(100, Math.round(value)));
      filteredVisibility = percent / 100;
      board.style.setProperty('--filtered-opacity', String(filteredVisibility));
      visibilityDial.style.setProperty('--dial-sweep', `${percent * 2.7}deg`);
      visibilityDial.style.setProperty('--dial-angle', `${-135 + percent * 2.7}deg`);
      visibilityDial.setAttribute('aria-valuenow', String(percent));
      visibilityDial.setAttribute('aria-valuetext', `${percent}% visibility for filtered-out heroes`);
      document.getElementById('visibility-value').textContent = `${percent}%`;
    }
    async function createGridImage() {
      await document.fonts.ready;
      const placed = [...board.querySelectorAll('.hero')]
        .filter(button => !button.classList.contains('is-filtered') || filteredVisibility > 0)
        .sort((a, b) => Number(a.style.zIndex) - Number(b.style.zIndex));
      await Promise.all(placed.map(button => button.querySelector('img').decode()));
      const heading = document.querySelector('h1');
      const titleRect = heading.getBoundingClientRect();
      const chartRect = document.querySelector('.chart').getBoundingClientRect();
      const gridRect = board.getBoundingClientRect();
      const padding = 24;
      const originX = chartRect.left - padding;
      const originY = titleRect.top - padding;
      const width = chartRect.width + padding * 2;
      const height = chartRect.bottom - titleRect.top + padding * 2;
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(width * 2);
      canvas.height = Math.ceil(height * 2);
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      ctx.fillStyle = '#10151e';
      ctx.fillRect(0, 0, width, height);
      function roundedRect(x, y, w, h, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
      }
      const x = gridRect.left - originX;
      const y = gridRect.top - originY;
      const w = gridRect.width;
      const h = gridRect.height;
      ctx.save();
      roundedRect(x, y, w, h, 5);
      ctx.clip();
      ctx.fillStyle = '#161d29';
      ctx.fillRect(x, y, w, h);
      const tint = ctx.createLinearGradient(x, y, x + w, y + h);
      tint.addColorStop(0, '#e58b3510');
      tint.addColorStop(.48, '#00000000');
      tint.addColorStop(1, '#67b7e209');
      ctx.fillStyle = tint;
      ctx.fillRect(x, y, w, h);
      for (let i = 1; i < 10; i++) {
        ctx.beginPath();
        ctx.strokeStyle = i === 5 ? '#95a1b5' : '#ffffff09';
        ctx.lineWidth = i === 5 ? 1.2 : 1;
        ctx.moveTo(x + w * i / 10, y);
        ctx.lineTo(x + w * i / 10, y + h);
        ctx.moveTo(x, y + h * i / 10);
        ctx.lineTo(x + w, y + h * i / 10);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(x + w / 2, y + h / 2, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#18202c';
      ctx.fill();
      ctx.strokeStyle = '#d9e0eb';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
      roundedRect(x + .5, y + .5, w - 1, h - 1, 5);
      ctx.strokeStyle = '#435064';
      ctx.stroke();
      for (const element of [heading, ...document.querySelectorAll('.label')]) {
        const rect = element.getBoundingClientRect();
        const style = getComputedStyle(element);
        ctx.save();
        ctx.translate(rect.left + rect.width / 2 - originX, rect.top + rect.height / 2 - originY);
        if (style.writingMode === 'vertical-rl') ctx.rotate(element.classList.contains('left') ? -Math.PI / 2 : Math.PI / 2);
        ctx.font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
        if ('letterSpacing' in ctx) ctx.letterSpacing = style.letterSpacing;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = style.color;
        const text = style.textTransform === 'uppercase' ? element.textContent.toUpperCase() : element.textContent;
        ctx.fillText(text.trim(), 0, 0);
        if (element === heading) {
          const textWidth = ctx.measureText(text.trim()).width;
          ctx.fillStyle = '#ffab48';
          ctx.fillRect(-textWidth / 2 - 57, -1.5, 35, 3);
          ctx.fillRect(textWidth / 2 + 22, -1.5, 35, 3);
        }
        ctx.restore();
      }
      for (const button of placed) {
        const rect = button.getBoundingClientRect();
        const px = rect.left - originX;
        const py = rect.top - originY;
        const style = getComputedStyle(button);
        // Composite each portrait once so exported opacity matches the matrix.
        const portrait = document.createElement('canvas');
        portrait.width = Math.ceil(rect.width * 2);
        portrait.height = Math.ceil(rect.height * 2);
        const portraitCtx = portrait.getContext('2d');
        portraitCtx.scale(2, 2);
        portraitCtx.beginPath();
        portraitCtx.roundRect(0, 0, rect.width, rect.height, 5);
        portraitCtx.fillStyle = '#536078';
        portraitCtx.fill();
        portraitCtx.clip();
        portraitCtx.fillStyle = style.getPropertyValue('--role').trim() || '#8da5b9';
        portraitCtx.fillRect(0, rect.height - 2, rect.width, 2);
        portraitCtx.beginPath();
        portraitCtx.roundRect(2, 2, rect.width - 4, rect.height - 4, 3);
        portraitCtx.clip();
        portraitCtx.drawImage(button.querySelector('img'), 2, 2, rect.width - 4, rect.height - 4);
        ctx.save();
        ctx.globalAlpha = button.classList.contains('is-filtered') ? filteredVisibility : 1;
        ctx.shadowColor = '#00000060';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 3;
        ctx.drawImage(portrait, px, py, rect.width, rect.height);
        ctx.restore();
      }
      return new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Could not create PNG.')), 'image/png'));
    }
    document.getElementById('export-image').addEventListener('click', async event => {
      const button = event.currentTarget;
      button.disabled = true;
      try {
        const blob = await createGridImage();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'overwatch-hero-grid.png';
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (error) {
        console.error('Image export failed:', error);
      } finally {
        button.disabled = false;
      }
    });
    function renderHero(id) {
      const button = buttons.get(id);
      button.classList.remove('dragging');
      button.style.removeProperty('left');
      button.style.removeProperty('top');
      const p = positions[id];
      if (p) {
        button.style.setProperty('--x', `${p.x * 100}%`);
        button.style.setProperty('--y', `${p.y * 100}%`);
        button.style.zIndex = ++layer;
        board.append(button);
      } else {
        const next = heroes.slice(heroes.findIndex(h => h.id === id) + 1)
          .map(h => buttons.get(h.id)).find(b => b && b.parentNode === tray);
        tray.insertBefore(button, next || null);
      }
      applyHeroFilter(button);
    }
    function contains(rect, x, y) {
      return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
    }
    function move(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      drag.clientX = event.clientX;
      drag.clientY = event.clientY;
      drag.button.style.left = `${event.clientX - drag.offsetX}px`;
      drag.button.style.top = `${event.clientY - drag.offsetY}px`;
      board.classList.toggle('drop-target', contains(board.getBoundingClientRect(), event.clientX, event.clientY));
      tray.classList.toggle('drop-target', contains(tray.getBoundingClientRect(), event.clientX, event.clientY));
    }
    function scrollDuringDrag() {
      if (!drag) return;
      // Let portraits from the bottom of a long mobile tray reach the grid.
      const edge = 65;
      const y = drag.clientY;
      const speed = y < edge ? -Math.ceil((edge - y) / 5) : y > innerHeight - edge ? Math.ceil((y - innerHeight + edge) / 5) : 0;
      if (speed) {
        window.scrollBy(0, speed);
        board.classList.toggle('drop-target', contains(board.getBoundingClientRect(), drag.clientX, y));
        tray.classList.toggle('drop-target', contains(tray.getBoundingClientRect(), drag.clientX, y));
      }
      scrollFrame = requestAnimationFrame(scrollDuringDrag);
    }
    function finish(event, canceled = false) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const current = drag;
      const rect = board.getBoundingClientRect();
      if (!canceled && contains(rect, event.clientX, event.clientY)) {
        const half = current.button.offsetWidth / 2;
        const x = Math.max(half, Math.min(rect.width - half, event.clientX - current.offsetX + half - rect.left));
        const y = Math.max(half, Math.min(rect.height - half, event.clientY - current.offsetY + half - rect.top));
        positions[current.id] = { x: x / rect.width, y: y / rect.height };
      } else if (!canceled && contains(tray.getBoundingClientRect(), event.clientX, event.clientY)) {
        delete positions[current.id];
      }
      drag = null;
      cancelAnimationFrame(scrollFrame);
      if (current.button.hasPointerCapture(current.pointerId)) current.button.releasePointerCapture(current.pointerId);
      board.classList.remove('drop-target');
      tray.classList.remove('drop-target');
      document.body.classList.remove('is-dragging');
      renderHero(current.id);
      current.button.focus({ preventScroll: true });
      save();
    }
    for (const hero of heroes) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'hero';
      button.dataset.hero = hero.id;
      button.dataset.role = hero.role;
      button.setAttribute('aria-label', hero.name + '. Use arrow keys to place or move; Delete to return to tray.');
      const img = document.createElement('img');
      img.src = hero.image;
      img.alt = '';
      img.draggable = false;
      button.append(img);
      buttons.set(hero.id, button);
      tray.append(button);
      button.addEventListener('pointerdown', event => {
        if (event.button !== 0 || drag || !activeRoles.has(hero.role)) return;
        event.preventDefault();
        const rect = button.getBoundingClientRect();
        drag = { id: hero.id, button, pointerId: event.pointerId, offsetX: event.clientX - rect.left, offsetY: event.clientY - rect.top, clientX: event.clientX, clientY: event.clientY };
        // Keep the element in place during capture; reparent only after the drop.
        button.classList.add('dragging');
        button.style.left = `${rect.left}px`;
        button.style.top = `${rect.top}px`;
        button.setPointerCapture(event.pointerId);
        document.body.classList.add('is-dragging');
        scrollFrame = requestAnimationFrame(scrollDuringDrag);
      });
      button.addEventListener('pointermove', move);
      button.addEventListener('pointerup', event => finish(event));
      button.addEventListener('pointercancel', event => finish(event, true));
      button.addEventListener('lostpointercapture', event => finish(event, true));
      button.addEventListener('keydown', event => {
        if (!activeRoles.has(hero.role)) return;
        if (drag) { if (event.key === 'Escape') finish({ pointerId: drag.pointerId }, true); return; }
        if (event.key === 'Delete' || event.key === 'Backspace') {
          event.preventDefault(); delete positions[hero.id]; renderHero(hero.id); save(); button.focus({ preventScroll: true }); return;
        }
        const delta = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[event.key];
        if (!delta) return;
        event.preventDefault();
        const p = positions[hero.id] || { x: .5, y: .5 };
        const rect = board.getBoundingClientRect();
        const halfX = button.offsetWidth / 2 / rect.width;
        const halfY = button.offsetHeight / 2 / rect.height;
        const step = event.shiftKey ? .1 : .02;
        positions[hero.id] = { x: Math.max(halfX, Math.min(1 - halfX, p.x + delta[0] * step)), y: Math.max(halfY, Math.min(1 - halfY, p.y + delta[1] * step)) };
        renderHero(hero.id); save(); button.focus({ preventScroll: true });
      });
    }
    heroes.forEach(hero => renderHero(hero.id));
    document.querySelectorAll('.role-filter').forEach(button => {
      button.addEventListener('click', () => {
        const role = button.dataset.role;
        if (activeRoles.has(role)) activeRoles.delete(role);
        else activeRoles.add(role);
        applyFilters();
      });
    });
    document.getElementById('reset-grid').addEventListener('click', () => {
      if (drag) finish({ pointerId: drag.pointerId }, true);
      positions = {};
      heroes.forEach(hero => renderHero(hero.id));
      save();
    });
    let dialPointer = null;
    function turnDial(event) {
      const rect = visibilityDial.getBoundingClientRect();
      const angle = Math.atan2(event.clientX - rect.left - rect.width / 2, rect.top + rect.height / 2 - event.clientY) * 180 / Math.PI;
      setFilteredVisibility((Math.max(-135, Math.min(135, angle)) + 135) / 2.7);
    }
    visibilityDial.addEventListener('pointerdown', event => {
      if (event.button !== 0 || dialPointer !== null) return;
      event.preventDefault();
      dialPointer = event.pointerId;
      visibilityDial.focus({ preventScroll: true });
      visibilityDial.setPointerCapture(event.pointerId);
      visibilityDial.classList.add('adjusting');
      turnDial(event);
    });
    visibilityDial.addEventListener('pointermove', event => {
      if (event.pointerId === dialPointer) turnDial(event);
    });
    function releaseDial(event) {
      if (event.pointerId !== dialPointer) return;
      dialPointer = null;
      visibilityDial.classList.remove('adjusting');
      if (visibilityDial.hasPointerCapture(event.pointerId)) visibilityDial.releasePointerCapture(event.pointerId);
    }
    visibilityDial.addEventListener('pointerup', releaseDial);
    visibilityDial.addEventListener('pointercancel', releaseDial);
    visibilityDial.addEventListener('lostpointercapture', releaseDial);
    visibilityDial.addEventListener('keydown', event => {
      const percent = Math.round(filteredVisibility * 100);
      const step = event.shiftKey ? 10 : 1;
      const values = { ArrowUp: percent + step, ArrowRight: percent + step, ArrowDown: percent - step, ArrowLeft: percent - step, PageUp: percent + 10, PageDown: percent - 10, Home: 0, End: 100 };
      if (!(event.key in values)) return;
      event.preventDefault();
      setFilteredVisibility(values[event.key]);
    });
    setFilteredVisibility(0);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && drag) finish({ pointerId: drag.pointerId }, true);
    });
    window.addEventListener('blur', () => { if (drag) finish({ pointerId: drag.pointerId }, true); });
  </script>
</body>
</html>
